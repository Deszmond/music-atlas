<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Atlas - Home</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>

<body>
  <main class="page-content">

    <header class="home-header">
      <h1 class="logo">Music Atlas</h1>
      <p class="subtitle">Explore global music cultures</p>
    </header>

	<div class="search-container">
	<label for="genre-search">Search genres</label>

	<input
		id="genre-search"
		class="search-bar"
		type="search"
		placeholder="Try Afrobeats"
	>
	</div>

	<div class="cta-section">
	<a href="explore.html">Enter Explore Map</a>
	</div>


    <section class="genre-scroll">

		<a
		class="genre-box"
		href="explore.html?genre=afrobeats">

		<div class="genre-card genre-card--afrobeats">
			<img
			src="../assets/card-images/wizkid.png"
			alt="Wizkid">
		</div>

		<h3>Afrobeats</h3>
		</a>

		<a
		class="genre-box"
		href="explore.html?genre=gospel">

		<div class="genre-card genre-card--gospel">
			<img
			src="../assets/card-images/kierra_sheard.png"
			alt="Kierra Sheard"
			data-genre="gospel">
		</div>

		<h3>Gospel</h3>
		</a>

      <a class="genre-box" href="explore.html?genre=uk-rap">
        <div class="genre-card genre-card--uk-rap">
          <img src="../assets/card-images/little_simz.png" alt="Little Simz" data-genre="uk-rap">
        </div>

        <h3>UK Rap</h3>
      </a>

      <a class="genre-box" href="explore.html?genre=reggae">
        <div class="genre-card genre-card--reggae">
          <img src="../assets/card-images/chronixx.png" alt="Chronixx" data-genre="reggae">
        </div>

        <h3>Reggae</h3>
      </a>
      
      <a class="genre-box" href="explore.html?genre=amapiano">
        <div class="genre-card genre-card--amapiano">
          <img src="../assets/card-images/uncle_waffles.png" alt="Uncle Waffles" data-genre="amapiano">
        </div>

        <h3>Amapiano</h3>
      </a>

    </section>

  </main>
</body>
</html>
